allowBuilds:
  esbuild: true
  ffmpeg-static: true
  # kokoro-js pulls onnxruntime-node, which ships a native binary.
  onnxruntime-node: true
  protobufjs: true
  sharp: true

overrides:
  # Advisories: undici (TLS validation bypass, DoS) via @actions/http-client;
  # sharp (libvips, libheif, librsvg) via @huggingface/transformers.
  undici: ">=6.29.1 <7"
  sharp: ">=0.35.5 <0.36"

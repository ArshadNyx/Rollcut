name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: dist/ is up to date
        # dist/ is committed because the composite action runs it straight from
        # the checkout; a stale dist/ would ship code that does not match src/.
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Integration tests
        run: pnpm test:e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Typecheck
        run: pnpm exec tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: dist/ is up to date
        # dist/ is committed because the composite action runs it straight from
        # the checkout; a stale dist/ would ship code that does not match src/.
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ is stale — run 'pnpm build' and commit the result."
            git --no-pager diff --stat dist
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      # Actions caches are scoped per ref, and only the default branch's caches
      # are readable from every other ref. Release runs happen on tag refs, so
      # they can never reuse a cache written by another tag — this job on main
      # is what actually populates the cache the Action restores.
      - name: Resolve cache keys
        id: keys
        run: |
          echo "lock=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "store=$(corepack pnpm store path 2>/dev/null || echo ~/.local/share/pnpm/store)" >> "$GITHUB_OUTPUT"
      - name: Cache browser, pnpm store and TTS weights
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.keys.outputs.store }}
            ~/.cache/ms-playwright
            ~/.cache/huggingface
          key: rollcut-${{ runner.os }}-${{ steps.keys.outputs.lock }}
          restore-keys: |
            rollcut-${{ runner.os }}-
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Integration tests
        run: pnpm test:e2e
      - name: Warm the TTS model cache
        # The e2e tests run silent, so nothing else pulls the weights that every
        # narrated release needs.
        run: |
          node --import tsx -e "
            import { kokoroTts } from './src/tts/kokoro.ts';
            await kokoroTts.synthesize('Warming the model cache.', undefined, '/tmp/warm.wav');
          "

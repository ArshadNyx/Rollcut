# Dogfood: Rollcut records its own demo on every release.
name: Demo

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        id: rollcut
        with:
          spec: demos/excalidraw.yaml
          token: ${{ github.token }}
          # TEMPORARY: proves the README commit path on a real runner.
          # Revert to the default (false) once verified.
          update-readme: true
      - run: echo "Recorded ${{ steps.rollcut.outputs.duration-seconds }}s → ${{ steps.rollcut.outputs.mp4 }}"

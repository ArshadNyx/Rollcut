# Selector drift canary.
#
# The demo specs point at real, third-party sites. When those sites change their
# markup a spec silently stops working, and the first person to find out should
# not be a user mid-release. This runs them on a schedule rather than in CI,
# because a third party shipping a redesign is not a regression in a pull
# request and must never block one.
name: Canary

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec:
          - demos/excalidraw.yaml
          - demos/vitest.yaml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Resolve cache keys
        id: keys
        run: |
          echo "lock=$(shasum -a 256 pnpm-lock.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "store=$(corepack pnpm store path 2>/dev/null || echo ~/.local/share/pnpm/store)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ steps.keys.outputs.store }}
            ~/.cache/ms-playwright
            ~/.cache/huggingface
          key: rollcut-${{ runner.os }}-${{ steps.keys.outputs.lock }}
          restore-keys: |
            rollcut-${{ runner.os }}-
      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Check before recording: a failed recording says a step broke, this says
      # which one and what would fix it. Reported either way, so a spec that
      # drifted is visible the day it happens rather than on release day.
      - name: Check ${{ matrix.spec }} still matches the live site
        id: check
        continue-on-error: true
        run: pnpm rollcut repair ${{ matrix.spec }} --check 2>&1 | tee repair.log

      - name: Summarise any drift
        if: steps.check.outcome == 'failure'
        run: |
          {
            echo "### \`${{ matrix.spec }}\` no longer matches the site"
            echo
            echo '```'
            cat repair.log
            echo '```'
            echo
            echo "Run \`pnpm rollcut repair ${{ matrix.spec }}\` to apply the fixes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record ${{ matrix.spec }}
        # Narration adds nothing to a selector check and costs a model download.
        run: pnpm rollcut record ${{ matrix.spec }} --no-narration --out out-canary
      - name: Upload the recording for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ strategy.job-index }}
          path: out-canary/
          retention-days: 7
          if-no-files-found: ignore
